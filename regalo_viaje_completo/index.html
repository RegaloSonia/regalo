<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#071a2f" />
  <title>Una sorpresa</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#071a2f;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    #app{position:fixed;inset:0;display:grid;place-items:center;background:#071a2f}
    .stage{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.7777778vw);overflow:hidden;background:#071a2f;isolation:isolate}
    .frame{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:1;transition:opacity var(--fade,1600ms) ease-in-out;will-change:opacity}
    .frame.is-active{opacity:1;pointer-events:auto;z-index:2}
    .frame img{width:100%;height:100%;display:block;object-fit:cover;transform:scale(1);transform-origin:center;will-change:transform;user-select:none;-webkit-user-drag:none}
    .frame.is-active img{animation:slowZoom 11s ease-out forwards}
    @keyframes slowZoom{from{transform:scale(1)}to{transform:scale(1.018)}}
    .cta-hotspot{position:absolute;left:10%;width:80%;bottom:1.8%;height:13%;border:0;background:transparent;cursor:pointer;padding:0;margin:0;z-index:5}
    .cta-hotspot:focus-visible{outline:2px solid rgba(255,255,255,.8);outline-offset:-9px;border-radius:999px}
    .blackout{position:absolute;inset:0;background:#03101d;opacity:0;pointer-events:none;z-index:8;transition:opacity 700ms ease-in-out}
    .blackout.on{opacity:1}
    .sound{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;z-index:20;width:38px;height:38px;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:rgba(5,15,30,.34);backdrop-filter:blur(6px);color:white;font-size:17px;display:none;place-items:center;cursor:pointer}
    .sound.show{display:grid}
    @media(prefers-reduced-motion:reduce){.frame{transition-duration:250ms!important}.frame.is-active img{animation:none}.blackout{transition-duration:250ms!important}}
  </style>
</head>
<body>
<main id="app" aria-label="Regalo de viaje">
  <section class="stage" id="stage">
    <div class="frame is-active" data-index="0"><img src="img/frame-01.png" alt="Mensaje inicial"><button class="cta-hotspot" aria-label="Empezar"></button></div>
    <div class="frame" data-index="1"><img src="img/frame-02.png" alt="Antes de descubrir el regalo"><button class="cta-hotspot" aria-label="Continuar"></button></div>
    <div class="frame" data-index="2"><img src="img/frame-03.png" alt="Londres, primer viaje"><button class="cta-hotspot" aria-label="Continuar"></button></div>
    <div class="frame" data-index="3"><img src="img/frame-04.png" alt="Cuenca"><button class="cta-hotspot" aria-label="Continuar"></button></div>
    <div class="frame" data-index="4"><img src="img/frame-05.png" alt="Roma"><button class="cta-hotspot" aria-label="Continuar"></button></div>
    <div class="frame" data-index="5"><img src="img/frame-06.png" alt="Oporto"><button class="cta-hotspot" aria-label="Descubrir la sorpresa"></button></div>
    <div class="frame" data-index="6"><img src="img/frame-07.png" alt="Niza, 4 de diciembre"><button class="cta-hotspot" aria-label="Descubrir una sorpresa más"></button></div>
    <div class="frame" data-index="7"><img src="img/frame-08.png" alt="Mónaco"><button class="cta-hotspot" aria-label="Ver mensaje final"></button></div>
    <div class="frame" data-index="8"><img src="img/frame-09.png" alt="Mensaje final"></div>
    <div class="blackout" id="blackout"></div>
    <button class="sound" id="sound" type="button" aria-label="Silenciar música">♪</button>
  </section>
</main>
<audio id="music" preload="auto" loop src="audio/musica.mp3"></audio>
<script>
(()=>{
  const frames=[...document.querySelectorAll('.frame')];
  const sound=document.getElementById('sound');
  const music=document.getElementById('music');
  let current=0,locked=false,muted=false;
  const fades=[1500,1600,1450,1500,1650,2400,1750,2150];
  frames.forEach(f=>{ const p=new Image(); p.src=f.querySelector('img').src; });
  sound.classList.add('show');
  function restartZoom(frame){ const img=frame.querySelector('img'); img.style.animation='none'; void img.offsetWidth; img.style.animation=''; }
  function fadeAudio(from,to,duration){ const start=performance.now(); music.volume=from; function tick(now){ const t=Math.min(1,(now-start)/duration); music.volume=Math.max(0,Math.min(1,from+(to-from)*t)); if(t<1)requestAnimationFrame(tick); } requestAnimationFrame(tick); }
  async function startMusic(){ if(muted)return; try{ music.volume=0; await music.play(); fadeAudio(0,.58,1800); }catch(e){} }
  async function goTo(next){ if(locked||next===current||next<0||next>=frames.length)return; locked=true; const from=frames[current],to=frames[next],duration=fades[current]||1600; from.style.setProperty('--fade',duration+'ms'); to.style.setProperty('--fade',duration+'ms'); restartZoom(to); to.classList.add('is-active'); from.classList.remove('is-active'); current=next; await new Promise(r=>setTimeout(r,duration+80)); locked=false; }
  frames.forEach((frame,index)=>{ const hotspot=frame.querySelector('.cta-hotspot'); if(!hotspot)return; hotspot.addEventListener('click',()=>{ if(index===0 && music.paused)startMusic(); if(index<frames.length-1)goTo(index+1); }); });
  sound.addEventListener('click',()=>{ muted=!muted; music.muted=muted; sound.textContent=muted?'×':'♪'; sound.setAttribute('aria-label',muted?'Activar música':'Silenciar música'); });
  window.addEventListener('keydown',e=>{ if(['ArrowRight','Enter',' '].includes(e.key)){e.preventDefault();if(current<frames.length-1)goTo(current+1)} if(e.key==='ArrowLeft'&&current>0){e.preventDefault();goTo(current-1)} });
})();
</script>
</body>
</html>
